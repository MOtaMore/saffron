[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
noise = "0.9"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# cargo run --features dev   -> faster iterative rebuilds
dev = ["bevy/dynamic_linking"]

# Our code lightly optimized, dependencies fully optimized: best dev experience.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
